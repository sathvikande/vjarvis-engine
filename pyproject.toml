[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vjarvis-engine"
version = "1.0.0"
description = "Autonomous VLSI Verification Patcher & Telemetry Bridge"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[project.scripts]
vjarvis = "vjarvis_engine.cli:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["vjarvis_engine*"]
